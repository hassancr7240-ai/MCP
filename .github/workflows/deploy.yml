name: CI/CD — MCP Azure Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  AZURE_WEBAPP_NAME: mcp-azure-server
  AZURE_RESOURCE_GROUP: mcp-rg

jobs:
  # ── Security Scan ────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scan tools
        run: pip install bandit safety

      - name: Bandit SAST scan
        run: bandit -r app/ -ll -x app/tests -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Dependency vulnerability scan
        run: safety check -r requirements.txt --full-report

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov httpx

      - name: Run tests
        env:
          AZURE_TENANT_ID: test-tenant
          AZURE_CLIENT_ID: test-client
          JWT_AUDIENCE: api://test-client
          KEY_VAULT_URL: https://test.vault.azure.net/
          BLOB_ACCOUNT_URL: https://test.blob.core.windows.net
          SQL_SERVER: test-server
          SQL_DATABASE: test-db
          SQL_USERNAME: test-user
          APP_ENV: development
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ── Build & Push Docker image ────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/mcp-azure-server
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/mcp-azure-server:cache
          cache-to: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/mcp-azure-server:cache,mode=max

  # ── Deploy to Azure App Service ──────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/mcp-azure-server:latest

      - name: Set Key Vault reference app settings
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --settings \
                KEY_VAULT_URL="${{ secrets.KEY_VAULT_URL }}" \
                AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
                AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
                JWT_AUDIENCE="${{ secrets.JWT_AUDIENCE }}" \
                APP_ENV="production" \
                APPLICATIONINSIGHTS_CONNECTION_STRING="${{ secrets.APPINSIGHTS_CONN }}"

      - name: Test live /health endpoint
        run: |
          sleep 30
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health)
          echo "Health status: $status"
          [ "$status" = "200" ] || exit 1

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deployment failed — check App Insights for details."
