services:
  # ── MCP FastAPI Server ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: runtime
    container_name: mcp-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Docker-internal service addresses (override .env which has external URLs)
      SQL_SERVER: sqlserver
      SQL_DATABASE: pm-history
      SQL_USERNAME: sa
      SQL_PASSWORD: "Dev@Password123!"
      BLOB_ACCOUNT_URL: "http://azurite:10000/devstoreaccount1"
      BLOB_CONTAINER_NAME: pm-documents
      FTP_HOST: sftp
      FTP_PORT: "22"
      FTP_USERNAME: pm-app
      FTP_PASSWORD: dev-password
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
      sftp:
        condition: service_started
    volumes:
      - ./app:/app/app:ro
      - ./frontend:/app/frontend:ro
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --reload --log-level debug
    networks:
      - internal
    restart: unless-stopped

  # ── SQL Server 2022 ─────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mcp-sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Dev@Password123!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Dev@Password123!" \
          -C -Q "SELECT 1" > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - internal

  # ── DB Initialiser — runs schema once then exits ─────────────────────────────
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mcp-db-init
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./sql/schema.sql:/schema.sql:ro
      - ./sql/init-db.sh:/init-db.sh:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]
    networks:
      - internal

  # ── Azurite — Azure Blob Storage emulator ───────────────────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: mcp-azurite
    ports:
      - "10000:10000"
    command: >
      azurite-blob
      --blobHost 0.0.0.0
      --blobPort 10000
      --loose
    volumes:
      - azuritedata:/data
    networks:
      - internal

  # ── SFTP — internal file share emulator ─────────────────────────────────────
  sftp:
    image: atmoz/sftp:latest
    container_name: mcp-sftp
    ports:
      - "2222:22"
    command: "pm-app:dev-password:1001"
    volumes:
      - sftpdata:/home/pm-app/pm-documents
    networks:
      - internal

volumes:
  sqldata:
  azuritedata:
  sftpdata:

networks:
  internal:
    driver: bridge
